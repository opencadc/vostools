# Test vosfs when its tree or shared workspace files change.
name: vosfs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "libs/vosfs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".github/**"
      - "tests/repo/**"
  push:
    branches: [main]
    paths:
      - "libs/vosfs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".github/**"
      - "tests/repo/**"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vosfs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/reusable-package.yml
    with:
      package: vosfs
      distribution: vosfs
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
