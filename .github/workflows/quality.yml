# Repository-wide checks. Always runs; path filters live on the per-package workflows.
name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check exact lockfile
        run: uv lock --check

      - name: Run all pre-commit hooks
        run: uv run --locked --all-packages pre-commit run --all-files --show-diff-on-failure

      - name: Run repository contract tests
        run: uv run --locked pytest tests/repo

      - name: Build strict documentation
        run: uv run --locked --all-packages zensical build --strict --clean

      - name: Build every package
        run: uv build --no-sources --all-packages --out-dir dist

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked --only-group dev cz check --message "$TITLE"

  required:
    name: Required
    if: always()
    needs: [quality, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require quality; pr-title may be skipped off pull requests
        env:
          QUALITY: ${{ needs.quality.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
        run: |
          status=0
          if [[ "$QUALITY" != "success" ]]; then echo "QUALITY concluded $QUALITY" >&2; status=1; fi
          if [[ "$PR_TITLE" != "success" && "$PR_TITLE" != "skipped" ]]; then
            echo "PR_TITLE concluded $PR_TITLE" >&2
            status=1
          fi
          exit "$status"
