# Publishes vos to PyPI when a legacy `vos=<version>` release is created. The existing PyPI
# trusted publisher is bound to this file name. pypi.yml publishes `<package>-vX.Y.Z` tags.
# Keep this workflow until that publisher is re-bound and the first new vos release succeeds.
name: Publish (legacy)

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  build-n-publish:
    name: Build and publish to PyPI
    needs: quality
    if: github.repository == 'opencadc/vostools' && contains(github.ref, '=')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Trusted publishing.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Check the tag names a package and its version
        run: |
          tag="${GITHUB_REF#refs/*/}"
          name="${tag%%=*}"
          version="${tag#*=}"
          if [[ ! "$name" =~ ^[a-z0-9-]+$ ]] || [[ ! -f "libs/$name/pyproject.toml" ]]; then
            echo "Invalid release tag $tag: no package libs/$name" >&2
            exit 1
          fi
          actual="$(uv version --package "$name" --short)"
          if [[ "$actual" != "$version" ]]; then
            echo "Tag version $version does not match version $actual in libs/$name/pyproject.toml" >&2
            exit 1
          fi
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - name: Build package
        run: uv build --no-sources --package "$PACKAGE" --out-dir dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
